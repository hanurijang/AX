<svg id="m5-town" viewBox="0 0 420 210" role="img" aria-label="연소득 전체 범위와 기존 주민 구간을 확대한 분포. 전후 요약값은 아래 표에 제공" xmlns="http://www.w3.org/2000/svg" width="420" height="210" style="font-family: &quot;Pretendard Variable&quot;, Pretendard, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, system-ui, sans-serif;"><title>연소득 전체 범위와 기존 주민 구간을 확대한 분포. 전후 요약값은 아래 표에 제공</title><desc>전체 축은 0~100,000만 원입니다. 기존 100명은 3,800~6,376만 원에 있고 추가한 한 명은 100,000만 원입니다. 아래 그림은 기존 주민 구간만 확대했습니다.</desc><text x="12" y="16" text-anchor="start" font-size="12" font-weight="800" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">전체 범위 · 연소득(만 원)</text><line x1="40" y1="58" x2="390" y2="58" stroke="#9AA0AA" stroke-width="1.6" stroke-dasharray="none"/><rect x="53.3" y="48" width="9.016000000000005" height="10" fill="#5B6E97"/><circle cx="390" cy="53" r="5" fill="#B42318"/><line x1="57.849999999999994" y1="47" x2="100" y2="32" stroke="#9AA0AA" stroke-width="1.6" stroke-dasharray="none"/><text x="104" y="34" text-anchor="start" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">기존 100명</text><text x="390" y="34" text-anchor="end" font-size="12" font-weight="600" fill="#B42318" stroke="none" stroke-width="0" paint-order="stroke">추가 1명: 10억 원</text><text x="40" y="77" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">0</text><text x="215" y="77" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">50,000</text><text x="390" y="77" text-anchor="end" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">100,000</text><text x="12" y="109" text-anchor="start" font-size="12" font-weight="800" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">기존 주민 구간 확대 · 이사 전후 도수는 같음</text><text x="30" y="132" text-anchor="end" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">36</text><text x="30" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">0</text><text x="390" y="128" text-anchor="end" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">명</text><rect x="41" y="176.61111111111111" width="48" height="1.3888888888888888" fill="#667CA3" data-count="1"/><rect x="91" y="162.72222222222223" width="48" height="15.277777777777779" fill="#667CA3" data-count="11"/><rect x="141" y="134.94444444444446" width="48" height="43.05555555555556" fill="#667CA3" data-count="31"/><rect x="191" y="128" width="48" height="50" fill="#667CA3" data-count="36"/><rect x="241" y="153" width="48" height="25" fill="#667CA3" data-count="18"/><rect x="291" y="173.83333333333334" width="48" height="4.166666666666666" fill="#667CA3" data-count="3"/><rect x="341" y="178" width="48" height="0" fill="#667CA3" data-count="0"/><line x1="40" y1="178" x2="390" y2="178" stroke="#9AA0AA" stroke-width="1.6" stroke-dasharray="none"/><text x="40" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">3,500</text><text x="190" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">5,000</text><text x="390" y="198" text-anchor="end" font-size="12" font-weight="600" fill="#1B2A4A" stroke="none" stroke-width="0" paint-order="stroke">7,000</text></svg>
