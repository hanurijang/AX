<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX — Framework</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    font: 15px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f6f7f9; color: #1c1e21;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e8eb; }
    figure { background: #1f2227; border-color: #2c3036; }
  }
  header { max-width: 1500px; margin: 0 auto 28px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; }
  p.sub { margin: 0; opacity: .65; font-size: 13px; }
  main { max-width: 1500px; margin: 0 auto; display: grid; gap: 28px; }
  figure {
    margin: 0; padding: 16px; border: 1px solid #e2e5e9;
    border-radius: 12px; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  figcaption {
    font-size: 13px; font-weight: 600; margin-bottom: 12px;
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  }
  figcaption a { font-weight: 400; opacity: .6; text-decoration: none; }
  figcaption a:hover { opacity: 1; text-decoration: underline; }
  img { display: block; width: 100%; height: auto; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>AX — Framework</h1>
  <p class="sub">GitHub Pages · <a href="https://github.com/hanurijang/AX">hanurijang/AX</a></p>
</header>
<main>
  <figure>
    <figcaption><span>Framework_R1</span><a href="Framework_R1.png">PNG 열기</a></figcaption>
    <img src="Framework_R1.png" alt="AX Framework R1" loading="lazy">
  </figure>
  <figure>
    <figcaption><span>Table_R1</span><a href="Table_R1.png">PNG 열기</a></figcaption>
    <img src="Table_R1.png" alt="AX Table R1" loading="lazy">
  </figure>
  <figure>
    <figcaption><span>framework</span><a href="framework.png">PNG 열기</a></figcaption>
    <img src="framework.png" alt="framework" loading="lazy">
  </figure>
</main>
</body>
</html>
