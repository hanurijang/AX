<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX — 학습 모듈 v1.0</title>
<style>
  :root { color-scheme: light dark; --navy:#1B2A4A; --navy2:#2C4170; --amber:#E0A100; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 72px;
    font: 15px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    background: #f6f7f9; color: #1c1e21;
  }
  header { max-width: 1100px; margin: 0 auto 28px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; color: var(--navy); }
  p.sub { margin: 0; opacity: .65; font-size: 13px; }
  p.sub a { color: inherit; }
  main { max-width: 1100px; margin: 0 auto; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  a.card {
    display: block; text-decoration: none; color: inherit;
    padding: 16px 16px 14px; border: 1px solid #e2e5e9; border-radius: 12px;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-2px); border-color: #c9d3e6;
    box-shadow: 0 6px 18px rgba(27,42,74,.12);
  }
  a.card:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .no {
    display: inline-grid; place-items: center;
    min-width: 34px; height: 22px; padding: 0 7px; border-radius: 6px;
    background: var(--navy); color: #fff;
    font-size: 12px; font-weight: 800; letter-spacing: .3px;
    font-variant-numeric: tabular-nums;
  }
  .ttl { display: block; margin-top: 10px; font-size: 15px; font-weight: 700; line-height: 1.42; letter-spacing: -.3px; }
  .go { display: block; margin-top: 8px; font-size: 12.5px; color: var(--navy2); opacity: .7; }
  a.card:hover .go { opacity: 1; text-decoration: underline; }
  footer { max-width: 1100px; margin: 28px auto 0; font-size: 12.5px; opacity: .6; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e8eb; }
    h1 { color: #cdd8ee; }
    a.card { background: #1f2227; border-color: #2c3036; }
    a.card:hover, a.card:focus-visible { border-color: #3a4d78; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
    .no { background: #2C4170; }
    .go { color: #a9b6cf; }
  }
</style>
</head>
<body>
<header>
  <h1>AX — 학습 모듈 v1.0</h1>
  <p class="sub">11개 모듈 · 데이터 분석의 목적부터 가설검정까지 · <a href="index.html">프레임워크 보기</a></p>
</header>

<main>
  <nav class="grid" aria-label="학습 모듈 목록">
    <a class="card" href="module_v10/M01.html"><span class="no">M01</span><span class="ttl">데이터 분석의 목적</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M02.html"><span class="no">M02</span><span class="ttl">통계학의 역할과 전체 모습</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M03.html"><span class="no">M03</span><span class="ttl">모집단과 표본</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M04.html"><span class="no">M04</span><span class="ttl">데이터 유형과 분포</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M05.html"><span class="no">M05</span><span class="ttl">기술통계량</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M06.html"><span class="no">M06</span><span class="ttl">확률과 확률분포</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M07.html"><span class="no">M07</span><span class="ttl">정규분포와 표준화</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M08.html"><span class="no">M08</span><span class="ttl">추론통계의 직관</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M09.html"><span class="no">M09</span><span class="ttl">표준오차</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M10.html"><span class="no">M10</span><span class="ttl">신뢰구간</span><span class="go">열기 →</span></a>
    <a class="card" href="module_v10/M11.html"><span class="no">M11</span><span class="ttl">가설검정의 원리와 p값</span><span class="go">열기 →</span></a>
  </nav>
</main>

<footer>module_v10 · M01–M11 · 키보드 ← / → 로 모듈 간 이동</footer>

<script>
  // ←/→ 키로 모듈 간 이동 (모듈 페이지 내부 슬라이드 조작은 해당 페이지에서 처리)
  const links = [...document.querySelectorAll('a.card')].map(a => a.getAttribute('href'));
  document.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = links.findIndex(h => location.pathname.endsWith(h.split('/').pop()));
    if (i < 0) return;
    const next = links[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if (next) location.href = next;
  });
</script>
</body>
</html>
